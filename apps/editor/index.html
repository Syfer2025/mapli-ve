<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP restritiva: o app é offline e não carrega nada de rede. `connect-src`
      permite só o dev server do Vite (HMR via ws), os dados locais e `blob:` —
      o GLTFLoader do three decodifica texturas embutidas do GLB via fetch de
      object URLs. `script-src blob:` é a fronteira explícita para módulos ESM
      de plugins que o processo main já validou e leu de `userData/plugins`.
    -->
    <!--
      `media-src` fica de fora do `default-src` de propósito: sem ele, mídia herda
      `'self'` e o editor não consegue tocar nem o vídeo que ele mesmo acabou de
      exportar. Aberto para **duas** origens e nenhuma mais: `blob:`, que é
      conteúdo que o próprio aplicativo criou, e `theatrum-data:`, o protocolo
      local — já confiado para imagem e fonte, e com guarda de `realpath` contra
      travessia. Fora `data:`, que permitiria embutir mídia arbitrária vinda de
      qualquer string que chegasse ao renderer.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: theatrum-data:; font-src 'self' data: theatrum-data:; media-src 'self' blob: theatrum-data:; connect-src 'self' blob: theatrum-data: ws://localhost:5273; worker-src 'self' blob:; object-src 'none'; base-uri 'none'"
    />
    <title>Theatrum</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

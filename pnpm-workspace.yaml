packages:
  - "apps/*"
  - "packages/*"
  - "tools"

# Scripts de instalação aprovados explicitamente. esbuild e electron precisam
# baixar/compilar binário nativo no postinstall; o resto continua bloqueado.
allowBuilds:
  esbuild: true
  electron: true
  # Dependência opcional do electron-builder para Squirrel; o Theatrum usa
  # NSIS, então o script dela é deliberadamente ignorado.
  electron-winstaller: false
